<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMOLED Clock — BLE Time Sync</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --accent: #4fd1ff;
    --accent2: #37e08c;
    --text: #e6edf3;
    --muted: #8a97a3;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #14202b, var(--bg));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid #223040;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .clock {
    text-align: center;
    background: #0d1319;
    border-radius: 12px;
    padding: 18px 12px;
    margin-bottom: 20px;
    border: 1px solid #1c2733;
  }
  .clock .time {
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .clock .date {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 4px;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.05s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #connectBtn {
    background: var(--accent);
    color: #04141c;
  }
  #syncBtn {
    background: var(--accent2);
    color: #04220f;
  }
  #disconnectBtn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 10px;
    font-size: 0.9rem;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }
  .dot.connected { background: var(--accent2); }
  #log {
    margin-top: 14px;
    background: #0d1319;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    max-height: 130px;
    overflow-y: auto;
    border: 1px solid #1c2733;
  }
  #log div { padding: 2px 0; }
  .note {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <h1>AMOLED Clock</h1>
  <p class="sub">Sync your phone/PC's current time to the ESP32-S3 display over Bluetooth LE.</p>

  <div class="clock">
    <div class="time" id="localTime">--:--:--</div>
    <div class="date" id="localDate">Loading local time…</div>
  </div>

  <button id="connectBtn">🔗 Connect to AMOLED-Clock</button>
  <button id="syncBtn" disabled>⏱ Send Current Time</button>
  <button id="disconnectBtn" disabled>Disconnect</button>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Not connected</span>
  </div>

  <div id="log"></div>

  <div class="note">
    Requires Chrome/Edge on desktop or Android (Web Bluetooth). Not supported
    on iOS Safari. Page must be served over HTTPS or opened from localhost.
  </div>
</div>

<script>
  const SERVICE_UUID     = "12345678-1234-5678-1234-56789abcdef0";
  const TIME_CHAR_UUID   = "12345678-1234-5678-1234-56789abcdef1";
  const STATUS_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef2";

  let device, server, timeChar, statusChar;

  const connectBtn = document.getElementById("connectBtn");
  const syncBtn = document.getElementById("syncBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const logEl = document.getElementById("log");

  function log(msg) {
    const line = document.createElement("div");
    const t = new Date().toLocaleTimeString();
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setConnected(isConnected) {
    statusDot.classList.toggle("connected", isConnected);
    statusText.textContent = isConnected ? "Connected" : "Not connected";
    syncBtn.disabled = !isConnected;
    disconnectBtn.disabled = !isConnected;
    connectBtn.disabled = isConnected;
  }

  // Local clock preview in the page itself (independent of the ESP32)
  function tickLocalClock() {
    const now = new Date();
    document.getElementById("localTime").textContent =
      now.toLocaleTimeString([], { hour12: false });
    document.getElementById("localDate").textContent =
      now.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
  }
  setInterval(tickLocalClock, 1000);
  tickLocalClock();

  async function connect() {
    if (!navigator.bluetooth) {
      log("Web Bluetooth is not supported in this browser.");
      alert("Web Bluetooth isn't available here. Use Chrome/Edge on desktop or Android.");
      return;
    }
    try {
      log("Requesting device...");
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }],
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener("gattserverdisconnected", onDisconnected);

      log(`Connecting to ${device.name || "device"}...`);
      server = await device.gatt.connect();

      const service = await server.getPrimaryService(SERVICE_UUID);
      timeChar = await service.getCharacteristic(TIME_CHAR_UUID);
      statusChar = await service.getCharacteristic(STATUS_CHAR_UUID);

      await statusChar.startNotifications();
      statusChar.addEventListener("characteristicvaluechanged", onStatusNotify);

      setConnected(true);
      log("Connected.");

      // Auto-sync immediately on connect
      await sendCurrentTime();
    } catch (err) {
      log(`Error: ${err.message}`);
    }
  }

  function onStatusNotify(event) {
    const value = new TextDecoder().decode(event.target.value);
    log(`Device says: ${value}`);
  }

  function onDisconnected() {
    setConnected(false);
    log("Device disconnected.");
  }

  async function sendCurrentTime() {
    if (!timeChar) return;
    const now = new Date();
    const epochSeconds = Math.floor(now.getTime() / 1000);
    // JS getTimezoneOffset() is minutes WEST of UTC; ESP32 protocol wants
    // minutes EAST of UTC, so we negate it.
    const tzOffsetMinutes = -now.getTimezoneOffset();

    const payload = `${epochSeconds},${tzOffsetMinutes}`;
    try {
      await timeChar.writeValue(new TextEncoder().encode(payload));
      log(`Sent time: ${payload} (${now.toString()})`);
    } catch (err) {
      log(`Write failed: ${err.message}`);
    }
  }

  async function disconnect() {
    if (device && device.gatt.connected) {
      device.gatt.disconnect();
    }
  }

  connectBtn.addEventListener("click", connect);
  syncBtn.addEventListener("click", sendCurrentTime);
  disconnectBtn.addEventListener("click", disconnect);
</script>

</body>
</html>
